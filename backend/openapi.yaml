openapi: 3.0.3
info:
  title: Dabsky Connect
  version: 0.3.0
  description: Authenticated Dabsky generation API with a procedural fallback and optional Hunyuan3D-2.1 GPU worker.
servers:
  - url: https://us-central1-dabsky-3d.cloudfunctions.net/dabskyApi
    description: Expected deployment URL; must be verified after deployment.
paths:
  /health:
    get:
      summary: Check backend health
      responses:
        '200':
          description: Healthy backend
  /v1/catalog:
    get:
      summary: List supported procedural model types
      responses:
        '200':
          description: Model catalog
  /v1/jobs:
    post:
      summary: Create a Dabsky 3D model job
      security:
        - FirebaseBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prompt]
              additionalProperties: false
              properties:
                prompt: { type: string, minLength: 1, maxLength: 500 }
                reference_image:
                  type: object
                  required: [mime_type, data_base64]
                  properties:
                    filename: { type: string, maxLength: 96 }
                    mime_type: { type: string, enum: [image/png, image/jpeg, image/webp] }
                    data_base64: { type: string, description: Base64 image capped at 6 MB before encoding. }
      responses:
        '201': { description: Procedural fallback job available }
        '202': { description: Neural worker job queued }
        '400': { description: Unsupported prompt }
        '401': { description: Missing or invalid Firebase ID token }
        '429': { description: Daily quota exceeded }
  /v1/jobs/{id}:
    get:
      summary: Inspect job status for its owner
      security:
        - FirebaseBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Owner job metadata }
        '401': { description: Authentication required }
        '404': { description: Job unavailable to this user }
  /v1/jobs/{id}/model:
    get:
      summary: Download job GLB as its owner
      security:
        - FirebaseBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Binary GLB
          content:
            model/gltf-binary:
              schema: { type: string, format: binary }
        '401': { description: Authentication required }
        '404': { description: Job unavailable to this user }
components:
  securitySchemes:
    FirebaseBearer:
      type: http
      scheme: bearer
      bearerFormat: Firebase ID token
