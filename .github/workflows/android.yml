name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  issues: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Announce build run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 1 --repo "$GITHUB_REPOSITORY" --body "APK build started: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} — commit: ${GITHUB_SHA}"
      - uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Install Godot 4.4.1 and export templates
        run: |
          set -euxo pipefail
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q Godot_v4.4.1-stable_linux.x86_64.zip
          sudo mv Godot_v4.4.1-stable_linux.x86_64 /usr/local/bin/godot
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz
          unzip -q Godot_v4.4.1-stable_export_templates.tpz
          mv templates/* "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
          godot --version
      - name: Configure Android editor settings
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
      - name: Create Android debug signing key
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
      - name: Confirm Godot Android SDK settings
        run: |
          test -s "$HOME/.config/godot/editor_settings-4.tres"
          test -s "$HOME/.android/debug.keystore"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          grep -E "export/android/(android_sdk_path|java_sdk_path)" "$HOME/.config/godot/editor_settings-4.tres"
      - name: Apply Dabsky launcher icon when media is present
        run: |
          if [ -s assets/dabsky-icon.png ]; then
            python3 - <<'PY'
          from pathlib import Path
          project = Path("project.godot")
          text = project.read_text()
          if 'config/icon="res://assets/dabsky-icon.png"' not in text:
              text = text.replace('config/name="Dabsky 3D Studio"', 'config/name="Dabsky 3D Studio"\\nconfig/icon="res://assets/dabsky-icon.png"'.replace('\\n', '\n'))
          project.write_text(text)
          preset = Path("export_presets.cfg")
          text = preset.read_text()
          if 'launcher_icons/main_192x192=' not in text:
              text += '\nlauncher_icons/main_192x192="res://assets/dabsky-icon.png"\n'
          preset.write_text(text)
          PY
          fi
      - name: Validate Godot project
        run: godot --headless --verbose --path . --editor --quit
      - name: Smoke-test safe-area layout and startup
        run: |
          godot --headless --path . --quit-after 20 2>&1 | tee godot-smoke.log
          if grep -E "SCRIPT ERROR|Parse Error|Invalid call|Failed to load script" godot-smoke.log; then
            exit 1
          fi
      - name: Exercise modeling workflow (create, edit, save, undo, load)
        run: godot --headless --path . --script res://tests/editor_smoke.gd
      - name: GLB export/import and material round-trip tests
        run: godot --headless --path . --script res://tests/v04_roundtrip.gd
      - name: Face extrusion, inset and vertex editing round-trip tests
        run: godot --headless --path . --script res://tests/v05_mesh_edit.gd
      - name: Dabsky AI offline assistant integration tests
        run: godot --headless --path . --script res://tests/v06_ai_commands.gd
      - name: Test Android two-finger pinch-to-zoom and orbit gestures
        run: godot --headless --path . --script res://tests/v061_touch_camera.gd
      - name: Test swiping on modeling toolbar buttons without accidental activation
        run: godot --headless --path . --script res://tests/v062_toolbar_scroll.gd
      - name: Configure permanent signing if secrets exist
        env:
          SIGNING_KEY_B64: ${{ secrets.DABSKY_KEYSTORE_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.DABSKY_KEYSTORE_PASSWORD }}
          SIGNING_ALIAS: ${{ secrets.DABSKY_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.DABSKY_KEY_PASSWORD }}
        run: |
          if [ -n "$SIGNING_KEY_B64" ] && [ -n "$SIGNING_PASSWORD" ] && [ -n "$SIGNING_ALIAS" ] && [ -n "$SIGNING_KEY_PASSWORD" ]; then
            printf '%s' "$SIGNING_KEY_B64" | base64 --decode > "$RUNNER_TEMP/dabsky-release.jks"
            chmod 600 "$RUNNER_TEMP/dabsky-release.jks"
            keytool -list -keystore "$RUNNER_TEMP/dabsky-release.jks" -alias "$SIGNING_ALIAS" -storepass "$SIGNING_PASSWORD" > /dev/null
            echo "Permanent signing keystore validated."
            echo "DABSKY_SIGNING_READY=true" >> "$GITHUB_ENV"
            echo "DABSKY_KEYSTORE_PATH=$RUNNER_TEMP/dabsky-release.jks" >> "$GITHUB_ENV"
          else
            echo "::error::Permanent signing secrets missing. Configure all four DABSKY_* repository secrets."
            exit 1
          fi
      - name: Export Android APK
        id: export
        env:
          SIGNING_PASSWORD: ${{ secrets.DABSKY_KEYSTORE_PASSWORD }}
          SIGNING_ALIAS: ${{ secrets.DABSKY_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.DABSKY_KEY_PASSWORD }}
        run: |
          mkdir -p build
          if [ "$DABSKY_SIGNING_READY" = "true" ]; then
            python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path("export_presets.cfg")
          content = p.read_text()
          content += '\nkeystore/release="' + os.environ["DABSKY_KEYSTORE_PATH"] + '"\n'
          content += 'keystore/release_user="' + os.environ["SIGNING_ALIAS"] + '"\n'
          content += 'keystore/release_password="' + os.environ["SIGNING_KEY_PASSWORD"] + '"\n'
          p.write_text(content)
          PY
            godot --headless --verbose --path . --export-release Android build/dabsky-3d.apk
          else
            godot --headless --verbose --path . --export-debug Android build/dabsky-3d.apk
          fi
          test -s build/dabsky-3d.apk
      - name: Verify APK signature and package
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs build/dabsky-3d.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging build/dabsky-3d.apk
          sha256sum build/dabsky-3d.apk
      - name: Upload APK
        id: upload
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dabsky-3d-apk
          path: build/dabsky-3d.apk
          if-no-files-found: error
      - name: Publish signed APK for direct download
        id: release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="dabsky3d-latest"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Dabsky 3D — Latest Signed APK" --notes "Automatically published, verified Android APK. Updates use Dabsky's existing permanent signing key."
          fi
          gh release upload "$TAG" "build/dabsky-3d.apk#dabsky-3d.apk" --repo "$GITHUB_REPOSITORY" --clobber
      - name: Export x86_64 debug APK for Android emulator testing
        run: |
          cp export_presets.cfg "$RUNNER_TEMP/export_release_preset.cfg"
          python3 - <<'PY'
          from pathlib import Path
          p = Path("export_presets.cfg")
          s = p.read_text()
          s = s.replace('architectures/arm64-v8a=true', 'architectures/arm64-v8a=false')
          s += '\narchitectures/x86_64=true\n'
          p.write_text(s)
          PY
          godot --headless --path . --export-debug Android build/dabsky-3d-emulator.apk
          test -s build/dabsky-3d-emulator.apk
          mv "$RUNNER_TEMP/export_release_preset.cfg" export_presets.cfg
      - name: Upload emulator APK for device smoke test
        uses: actions/upload-artifact@v4
        with:
          name: dabsky-3d-emulator-apk
          path: build/dabsky-3d-emulator.apk
          if-no-files-found: error
      - name: Report build result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          EXPORT_OUTCOME: ${{ steps.export.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        run: |
          RUN_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [ "$EXPORT_OUTCOME" = "success" ] && [ "$UPLOAD_OUTCOME" = "success" ]; then
            MSG="APK build successful: $RUN_URL — download **dabsky-3d-apk** from the run's Artifacts section. Commit: $GITHUB_SHA"
          else
            MSG="APK build failed: $RUN_URL — export: $EXPORT_OUTCOME; artifact upload: $UPLOAD_OUTCOME. Commit: $GITHUB_SHA"
          fi
          gh issue comment 1 --repo "$GITHUB_REPOSITORY" --body "$MSG"

  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Enable KVM acceleration
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Download Android x86_64 test APK
        uses: actions/download-artifact@v4
        with:
          name: dabsky-3d-emulator-apk
          path: emulator-build
      - name: Run Android emulator and launch Dabsky
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -camera-back none -camera-front none
          script: |
            adb install -r emulator-build/dabsky-3d-emulator.apk
            adb shell am force-stop com.dabsky.studio3d || true
            adb shell monkey -p com.dabsky.studio3d -c android.intent.category.LAUNCHER 1
            sleep 18
            adb shell pidof com.dabsky.studio3d
            mkdir -p emulator-build/diagnostics
            adb logcat -d -v time > emulator-build/diagnostics/logcat.txt
            if grep -E -i "FATAL EXCEPTION|SCRIPT ERROR:|ERROR: .*Failed to load|Fatal signal" emulator-build/diagnostics/logcat.txt; then echo "::error::Android emulator reported a Godot or process crash"; exit 1; fi
            adb shell screencap -p /sdcard/dabsky-studio-emulator.png
            adb pull /sdcard/dabsky-studio-emulator.png emulator-build/diagnostics/screenshot.png
            echo "DABSKY ANDROID EMULATOR LAUNCH PASSED"
      - name: Upload emulator screenshot and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dabsky-android-emulator-diagnostics
          path: emulator-build/diagnostics/
          if-no-files-found: warn
