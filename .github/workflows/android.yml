name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  issues: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Install Godot 4.4.1 and export templates
        run: |
          set -euxo pipefail
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q Godot_v4.4.1-stable_linux.x86_64.zip
          sudo mv Godot_v4.4.1-stable_linux.x86_64 /usr/local/bin/godot
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz
          unzip -q Godot_v4.4.1-stable_export_templates.tpz
          mv templates/* "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
          godot --version
      - name: Configure Android editor settings
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
      - name: Create Android debug signing key
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
      - name: Confirm Godot Android SDK settings
        run: |
          test -s "$HOME/.config/godot/editor_settings-4.tres"
          test -s "$HOME/.android/debug.keystore"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          grep -E "export/android/(android_sdk_path|java_sdk_path)" "$HOME/.config/godot/editor_settings-4.tres"
      - name: Validate Godot project
        run: godot --headless --verbose --path . --editor --quit
      - name: Export debug APK
        id: export
        run: |
          mkdir -p build
          godot --headless --verbose --path . --export-debug Android build/dabsky-3d-debug.apk
          test -s build/dabsky-3d-debug.apk
      - name: Verify APK signature and package
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose build/dabsky-3d-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging build/dabsky-3d-debug.apk
          sha256sum build/dabsky-3d-debug.apk
      - name: Upload APK
        id: upload
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dabsky-3d-debug-apk
          path: build/dabsky-3d-debug.apk
          if-no-files-found: error
      - name: Report build result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          EXPORT_OUTCOME: ${{ steps.export.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        run: |
          RUN_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [ "$EXPORT_OUTCOME" = "success" ] && [ "$UPLOAD_OUTCOME" = "success" ]; then
            MSG="APK build successful: $RUN_URL — download **dabsky-3d-debug-apk** from the run's Artifacts section. Commit: $GITHUB_SHA"
          else
            MSG="APK build failed: $RUN_URL — export: $EXPORT_OUTCOME; artifact upload: $UPLOAD_OUTCOME. Commit: $GITHUB_SHA"
          fi
          gh issue comment 1 --repo "$GITHUB_REPOSITORY" --body "$MSG"
